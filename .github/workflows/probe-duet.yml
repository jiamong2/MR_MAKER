# 듀엣(남/여) 분리 후보 모델 점검 (실험 기능 개발용)
name: Probe duet models

on:
  push:
    branches: [main]
    paths: ["scripts/probe_duet_models.py", ".github/workflows/probe-duet.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy einops pyyaml
      - name: Probe
        run: python scripts/probe_duet_models.py "$RUNNER_TEMP/probe"
