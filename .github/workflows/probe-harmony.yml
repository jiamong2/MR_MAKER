# 화음 따기(두 성부 음정 추적) 점검 (실험 기능 개발용)
name: Probe harmony models

on:
  push:
    branches: [main]
    paths: ["scripts/probe_harmony.py", ".github/workflows/probe-harmony.yml", "src/music_separator/rmvpe.py",
            "src/music_separator/transcribe.py", "src/music_separator/harmony.py"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/common.txt
          pip install --no-deps -r requirements/demucs.txt
          pip install soundfile librosa
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI "$RUNNER_TEMP/rvc"
      - name: Probe
        run: python scripts/probe_harmony.py "$RUNNER_TEMP/probe" "$RUNNER_TEMP/rvc"
      - name: Harmony unit tests
        if: always()
        run: |
          pip install pytest
          QT_QPA_PLATFORM=offscreen pytest -q tests/test_harmony.py tests/test_ui_widgets.py -rfE --tb=short 2>&1 | tee pytest.log
          tail -30 pytest.log | tr '\n' '|' | cut -c1-3500 | sed 's/^/::notice title=pytest::/'
